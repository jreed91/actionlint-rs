# Known-GOOD: a reusable workflow (workflow_call) with typed inputs, secrets, and outputs.
# Lints clean on its own and is the callee for reusable-caller.yml.
name: Reusable deploy
on:
  workflow_call:
    inputs:
      environment:
        description: Target environment
        required: true
        type: string
      dry-run:
        description: Skip the actual deploy
        required: false
        default: false
        type: boolean
    secrets:
      deploy-token:
        description: Token used to authenticate the deploy
        required: true
    outputs:
      url:
        description: The deployed URL
        value: ${{ jobs.deploy.outputs.url }}

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.publish.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - id: publish
        run: |
          echo "deploying to ${{ inputs.environment }} (dry-run=${{ inputs.dry-run }})"
          echo "url=https://${{ inputs.environment }}.example.com" >> "$GITHUB_OUTPUT"
        env:
          DEPLOY_TOKEN: ${{ secrets.deploy-token }}
