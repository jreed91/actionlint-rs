# Known-GOOD: exercises workflow- and job-level `concurrency:`, a matrix with `include`/
# `exclude`, `fail-fast`, `max-parallel`, `strategy`, and `outputs`. Must lint clean.
name: Build matrix
on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    concurrency:
      group: build-${{ matrix.os }}-${{ matrix.node }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 20, 22]
        include:
          - os: ubuntu-latest
            node: 20
            coverage: true
        exclude:
          - os: windows-latest
            node: 18
    outputs:
      built: ${{ steps.build.outputs.result }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - id: build
        run: |
          npm ci
          npm run build
          echo "result=ok" >> "$GITHUB_OUTPUT"
      - if: ${{ matrix.coverage }}
        run: npm run coverage
