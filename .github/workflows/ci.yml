# CI: build, test, corpus gate, and coverage gate.
name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Cache the cargo registry + target dir across runs so compilation is incremental.
      - uses: Swatinem/rust-cache@v2
      # Build the release CLI ONCE, then reuse that same binary for the corpus gate below
      # (via ACTIONLINT_RS_BIN) instead of letting run-corpus.sh rebuild it.
      - name: Build release CLI (once)
        run: cargo build --release --verbose
      - name: Tests (unit + integration)
        run: cargo test --verbose
      - name: Golden corpus regression gate
        # Reuses the release binary built above rather than compiling again.
        env:
          ACTIONLINT_RS_BIN: ./target/release/actionlint-rs
        run: ./scripts/run-corpus.sh
      - name: Cross-validation gate (first-party vs SchemaStore drift)
        # Fails if the two schemas' disagreements on real workflows drift from the checked-in
        # baseline (corpus/xval/BASELINE.txt). See tests/xval.rs. Reuses the cached target dir
        # and artifacts from the build/test steps above.
        run: cargo test --test xval

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      # Coverage needs its own instrumented build (separate target dir), but caching still
      # speeds up dependency compilation across runs.
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Library coverage gate (see docs/coverage.md)
        # 100% of *reachable* library code. main.rs (CLI glue) is excluded (covered by
        # tests/cli.rs). Lines >= 98% is the primary bar; regions >= 97% because defensive
        # closures/match-arms (unreachable fallbacks, assert-failure strings) shouldn't force
        # test theater. See docs/coverage.md.
        run: cargo llvm-cov --lib --fail-under-lines 98 --fail-under-regions 97

  action:
    # End-to-end test of the distribution paths:
    #  1. the Docker image (Dockerfile) exercised the way `runs: using: docker` invokes it, and
    #  2. the composite action.yml (which, on this branch ref, has no matching release binary
    #     and so builds from source — the fallback path consumers hit before a release).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The composite action falls back to `cargo build`; ensure a toolchain is present rather
      # than relying on the runner's preinstalled Rust.
      - uses: dtolnay/rust-toolchain@stable

      - name: Build action image
        run: docker build -t actionlint-rs:ci .

      - name: Repo's own workflows lint clean (dogfood, exit 0)
        run: |
          docker run --rm -v "$PWD:/github/workspace" -w /github/workspace \
            actionlint-rs:ci ""

      - name: Explicit good file exits 0
        run: |
          docker run --rm -v "$PWD:/github/workspace" -w /github/workspace \
            actionlint-rs:ci corpus/good/minimal.yml

      - name: Broken workflow is detected (expect exit 1)
        run: |
          work="$(mktemp -d)"
          mkdir -p "$work/.github/workflows"
          printf 'on: push\njobs:\n  b:\n    steps: [{run: hi}]\n' \
            > "$work/.github/workflows/broken.yml"
          if docker run --rm -v "$work:/github/workspace" -w /github/workspace \
               actionlint-rs:ci ""; then
            echo "::error::linter should have failed on the broken workflow"
            exit 1
          fi
          echo "broken workflow correctly detected (non-zero exit)"

      - name: Action runs via action.yml (composite, build-from-source fallback)
        # Exercises the composite action.yml itself (input wiring + the from-source fallback
        # taken when no release binary matches this ref).
        uses: ./
        with:
          files: corpus/good/minimal.yml
